{% extends "base.html" %}
{% block title %}Change Password — Smart Attendance System{% endblock %}
{% block breadcrumb %}<i class="bi bi-shield-lock-fill me-2"></i>Security{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-title">Change Password</h2>
  <p class="page-subtitle">Update your admin login credentials</p>
</div>

<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card card-custom">
      <div class="card-header-custom">
        <h5 class="mb-0"><i class="bi bi-key-fill me-2"></i>Password Details</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-500">Current Password</label>
            <input type="password" class="form-control" name="current_password" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-500">New Password</label>
            <input type="password" class="form-control" name="new_password" required minlength="6">
            <small class="text-muted">Must be at least 6 characters long.</small>
          </div>
          <div class="mb-4">
            <label class="form-label fw-500">Confirm New Password</label>
            <input type="password" class="form-control" name="confirm_password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-shield-check me-2"></i>Update Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
